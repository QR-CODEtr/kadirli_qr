<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kadirli Sucuk Ekmek</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Teko:wght@600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="mobil-header">
        <!-- 1. En Üst: LOGO -->
        <div class="logo-bolumu">
            <img src="logo.png" alt="Logo" class="ana-logo">
        </div>

        <!-- 2. Orta Kısım: Sucuk - Başlık - Şalgam -->
        <div class="hero-bolumu">
            
            <!-- Sol Resim -->
            <div class="yan-resim-kutu">
                <img src="sucuk.png" alt="Sucuk" class="yan-img">
            </div>

            <!-- Orta Yazı -->
            <div class="baslik-kutu">
                <h1 class="firma-adi">Kadirli<br>Sucuk Ekmek</h1>
                <span class="menu-etiket">MENÜMÜZ</span>
            </div>

            <!-- Sağ Resim -->
            <div class="yan-resim-kutu">
                <img src="salgam.png" alt="Şalgam" class="yan-img">
            </div>

        </div>
        
        <!-- Kırmızı Çizgi Süsü -->
        <div class="cizgi-sus"></div>
    </header>

    <main id="menu-container">
        <!-- Menü JS ile gelecek -->
    </main>

    <footer class="mobil-footer">
        <p>Afiyet Olsun!</p>
        <a href="tel:03122301260" class="arama-butonu">📞 SİPARİŞ VER</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
