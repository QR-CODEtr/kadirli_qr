<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Bu meta etiketi mobil uyumluluk için çok kritiktir -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kadirli Sucuk Ekmek</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Teko:wght@600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="mobil-header">
        <!-- EN ÜST: LOGO -->
        <div class="logo-alani">
            <img src="logo.png" alt="Kadirli Logo" class="ana-logo">
        </div>

        <!-- ALT KISIM: TEK SATIR (SOL RESİM - YAZI - SAĞ RESİM) -->
        <div class="hero-satir">
            
            <!-- Sol Resim Kutusu (%25 Genişlik) -->
            <div class="yan-kutu">
                <img src="sucuk.png" alt="Sucuk" class="yan-img">
            </div>

            <!-- Orta Yazı Kutusu (%50 Genişlik) -->
            <div class="orta-kutu">
                <h1 class="baslik-text">Kadirli<br>Sucuk Ekmek</h1>
                <div class="etiket">MENÜMÜZ</div>
            </div>

            <!-- Sağ Resim Kutusu (%25 Genişlik) -->
            <div class="yan-kutu">
                <img src="salgam.png" alt="Şalgam" class="yan-img">
            </div>

        </div>
        
        <div class="kirmizi-cizgi"></div>
    </header>

    <main id="menu-container">
        <!-- JavaScript burayı dolduracak -->
    </main>

    <!-- YENİ EKLENEN KISIM: İSİM VE TARİH -->
    <div style="text-align: center; margin: 20px 0; color: #999; font-size: 12px; font-weight: bold;">
        Kadirli Sucuk Ekmek - 2025
    </div>
    <!-- EKLEME SONU -->

    <footer class="mobil-footer">
        <a href="tel:03122301260" class="siparis-btn">📞 SİPARİŞ İÇİN ARA</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
